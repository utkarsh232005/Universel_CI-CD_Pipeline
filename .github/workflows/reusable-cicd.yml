name: Reusable CI/CD Pipeline

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
        description: "Path to the project configuration file"
      node_version:
        required: false
        type: string
        default: "20"
        description: "Node.js version to use"
      skip_tests:
        required: false
        type: boolean
        default: false
        description: "Skip test stage"
      skip_deploy:
        required: false
        type: boolean
        default: false
        description: "Skip deployment stage"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: 📋 Load project configuration
        run: |
          echo "Loading config: ${{ inputs.config_file }}"
          if [ ! -f "${{ inputs.config_file }}" ]; then
            echo "❌ Config file not found: ${{ inputs.config_file }}"
            exit 1
          fi
          cp ${{ inputs.config_file }} ./project.env
          echo "✅ Configuration loaded successfully"

      - name: 🏗️ Build Stage
        run: bash pipeline/build.sh
        env:
          CONFIG_FILE: ./project.env

      - name: 🧪 Test Stage
        if: ${{ !inputs.skip_tests }}
        run: bash pipeline/test.sh
        env:
          CONFIG_FILE: ./project.env

      - name: 🐋 Docker Login (if needed)
        if: ${{ !inputs.skip_deploy }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: 🚀 Deploy Stage
        if: ${{ !inputs.skip_deploy }}
        run: bash pipeline/deploy.sh
        env:
          CONFIG_FILE: ./project.env
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: 📢 Notify Success
        if: success()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d '{"text":"✅ CI/CD Pipeline succeeded for ${{ github.repository }}"}'
          fi

      - name: 📢 Notify Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d '{"text":"❌ CI/CD Pipeline failed for ${{ github.repository }}"}'
          fi
